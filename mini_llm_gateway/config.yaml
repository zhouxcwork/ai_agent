# Mini LLM Gateway 配置：数据库、供应商、档位路由（含权重/能力/价格）、熔断参数
# API Key 只声明环境变量名，真实值从环境变量 / .env 注入

database:
  path: data/gateway.db

admin:
  token_env: GATEWAY_ADMIN_TOKEN

providers:
  openai:
    base_url: https://api.openai.com
    api_key_env: OPENAI_API_KEY
    enabled: true
  deepseek:
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    enabled: true

# 档位：model 字段唯一合法取值；候选按权重轮询选主选，失败按剩余健康候选 fallback
modes:
  fast:
    strategy: weighted_round_robin
    targets:
      - provider: deepseek
        model: deepseek-chat
        weight: 3
        supports_structured_output: true
        structured_output_mode: json_object
        price_per_million: {input: 0.28, output: 0.42}   # 美元 / 1M tokens
      - provider: openai
        model: gpt-5-mini
        weight: 1
        supports_structured_output: true
        structured_output_mode: json_schema
        price_per_million: {input: 0.25, output: 2.0}
  smart:
    strategy: weighted_round_robin
    targets:
      - provider: openai
        model: gpt-5.2
        weight: 2
        supports_structured_output: true
        structured_output_mode: json_schema
        price_per_million: {input: 1.75, output: 14.0}
      - provider: deepseek
        model: deepseek-reasoner
        weight: 1
        supports_structured_output: true
        structured_output_mode: json_object
        price_per_million: {input: 0.55, output: 2.19}

# 熔断：连续失败达阈值熔断；冷却期满半开试探一次，成功恢复、失败重熔断
circuit_breaker:
  failure_threshold: 5
  cooldown_seconds: 30

# 非流式结构化输出：解析失败先无损提取修复，仍失败重试上游（次），耗尽报明确错误
structured_output:
  max_retries: 2
