# Mini LLM Gateway 配置：数据库、供应商、档位路由（含权重/能力/价格）、熔断参数
# API Key 只声明环境变量名，真实值从环境变量 / .env 注入

database:
  path: data/gateway.db

admin:
  token_env: GATEWAY_ADMIN_TOKEN

# 调用方认证白名单（ADR 0011）：Authorization: Bearer <apikey> → tenantId；为空 = 不启用认证
auth:
  api_keys:
    replace-with-a-long-random-secret: tenant-demo

# 资源边界（ADR 0011）：租户 QPS 令牌桶 + 租户/路由目标并发，全部 429 快速拒绝
limits:
  default: {qps: 10, burst: 20, max_concurrency: 5}   # 未单独配置的租户（含 anonymous）
  tenants:
    tenant-demo: {qps: 20, burst: 40, max_concurrency: 10}
  targets:   # 键 = 路由目标（供应商/模型），未配置的目标不限；qps 可选（按模型独立限流）
    deepseek-anthropic/deepseek-v4-flash: {max_concurrency: 20, qps: 10}
    deepseek-responses/deepseek-v4-pro: {max_concurrency: 10, qps: 5}

# 协议端点连接（ADR 0013）：一个 provider 条目 = 供应商经某协议接入的一条连接；
# DeepSeek 两条连接共用同一 Key，分别走 Anthropic Messages 与 OpenAI Responses 端点
providers:
  deepseek-anthropic:
    base_url: https://api.deepseek.com/anthropic
    api_key_env: DEEPSEEK_API_KEY
    protocol: anthropic
    enabled: true
  deepseek-responses:
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    protocol: responses
    enabled: true
  openai:
    base_url: https://api.openai.com
    api_key_env: OPENAI_API_KEY
    protocol: openai
    enabled: false   # 暂未接入（无 Key 时被选中会 503），先保留配置；接入后改 true

# 档位：model 字段唯一合法取值；候选按权重轮询选主选，失败按剩余健康候选 fallback
# 双协议组合（ADR 0013）：fast → V4-Flash 走 Anthropic Messages、smart → V4-Pro 走 OpenAI Responses
modes:
  fast:
    strategy: weighted_round_robin
    targets:
      - provider: deepseek-anthropic
        model: deepseek-v4-flash
        weight: 9
        supports_structured_output: true
        structured_output_mode: tool_use   # Anthropic 协议无 response_format，tool 强制输出 JSON
        # 高峰时段价（工作日 9-12/14-18），输入按缓存未命中；人民币 3.0/9.0 元按 7.1 汇率折美元
        price_per_million: {input: 0.42, output: 1.27}
      - provider: openai
        model: gpt-5-mini
        weight: 1
        supports_structured_output: true
        structured_output_mode: json_schema
        price_per_million: {input: 0.25, output: 2.0}
  smart:
    strategy: weighted_round_robin
    targets:
      - provider: deepseek-responses
        model: deepseek-v4-pro
        weight: 9
        supports_structured_output: true
        structured_output_mode: json_schema   # Responses 协议结构化走 text.format
        # 高峰时段价（工作日 9-12/14-18），输入按缓存未命中；人民币 9.0/27.0 元按 7.1 汇率折美元
        price_per_million: {input: 1.27, output: 3.80}
      - provider: openai
        model: gpt-5.2
        weight: 1
        supports_structured_output: true
        structured_output_mode: json_schema
        price_per_million: {input: 1.75, output: 14.0}

# 熔断：连续失败达阈值熔断；冷却期满半开试探一次，成功恢复、失败重熔断
circuit_breaker:
  failure_threshold: 5
  cooldown_seconds: 30

# 非流式结构化输出：解析失败先无损提取修复，仍失败重试上游（次），耗尽报明确错误
structured_output:
  max_retries: 2

# Fallback：切换下一候选前，每个路由目标的重试次数（不含初次，ADR 0014；线性退避 0.1s/0.2s）
retries_per_target: 2
